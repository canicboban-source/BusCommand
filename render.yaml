# Render.com — Blueprint (Web Service)
# Dashboard: New > Blueprint > connect repo BusCommand
services:
  - type: web
    name: buscommand
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://buscommand.com,https://www.buscommand.com
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
