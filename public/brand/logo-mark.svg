<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="BusCommand">
  <defs>
    <!-- Indigo gradient for frame -->
    <linearGradient id="frame-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Emerald-to-indigo gradient for the B letter -->
    <linearGradient id="b-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <!-- Deep indigo gradient for the C letter -->
    <linearGradient id="c-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <!-- Network line gradient -->
    <linearGradient id="net-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background: dark rounded rectangle -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="#0f172a"/>

  <!-- Frame border -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="none" stroke="url(#frame-grad)" stroke-width="7"/>

  <!-- Letter B — bold block letter with cutouts for top/bottom bowls -->
  <g>
    <!-- B vertical stem -->
    <rect x="52" y="58" width="22" height="140" rx="3" fill="url(#b-grad)"/>
    <!-- B top bowl -->
    <path d="M74 58 H110 C130 58 140 68 140 82 C140 96 130 106 110 106 H74 Z" fill="url(#b-grad)"/>
    <!-- B bottom bowl -->
    <path d="M74 106 H115 C137 106 148 118 148 134 C148 150 137 162 115 162 H74 V106 Z" fill="url(#b-grad)"/>
    <!-- B top bowl cutout -->
    <rect x="74" y="72" width="34" height="22" rx="8" fill="#0f172a"/>
    <!-- B bottom bowl cutout -->
    <rect x="74" y="118" width="40" height="30" rx="10" fill="#0f172a"/>
  </g>

  <!-- Heartbeat line across the B -->
  <polyline
    points="52,120 72,120 80,100 90,140 100,108 108,120 148,120"
    fill="none" stroke="url(#net-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- Letter C — behind B, shifted right -->
  <path
    d="M190 74 C178 60 162 54 146 56 C146 56 146 56 146 56
       M146 200 C162 202 178 196 190 182"
    fill="none" stroke="url(#c-grad)" stroke-width="22" stroke-linecap="round"
  />
  <!-- C body arc -->
  <path
    d="M148 56 C120 58 106 78 106 128 C106 178 120 198 148 200"
    fill="none" stroke="url(#c-grad)" stroke-width="22" stroke-linecap="round"
  />

  <!-- Network diagonal line -->
  <line x1="56" y1="200" x2="204" y2="52" stroke="url(#net-grad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Network node — bottom left -->
  <circle cx="56" cy="200" r="10" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
  <circle cx="56" cy="200" r="4" fill="#34d399"/>

  <!-- Network node — center -->
  <circle cx="130" cy="126" r="12" fill="#0f172a" stroke="#6ee7b7" stroke-width="4"/>
  <circle cx="130" cy="126" r="5" fill="#6ee7b7"/>

  <!-- Network node — top right -->
  <circle cx="204" cy="52" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="4"/>
  <circle cx="204" cy="52" r="4" fill="#818cf8"/>
</svg>
