name: Integrated QA

on:
  push:
    branches:
      - preview/dispatcher-cockpit-qa
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full application verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Public browser config plus isolated localhost emulator build values
      - name: Complete application verification
        run: |
          cp .env.example .env.local
          cat << 'EOF' >> .env.local
          VITE_USE_FIREBASE_EMULATOR=1
          VITE_FIREBASE_EMULATOR_PROJECT_ID=demo-buscommand-scale
          VITE_FIREBASE_EMULATOR_FIRESTORE_HOST=127.0.0.1
          VITE_FIREBASE_EMULATOR_FIRESTORE_PORT=8080
          VITE_FIREBASE_EMULATOR_AUTH_HOST=127.0.0.1
          VITE_FIREBASE_EMULATOR_AUTH_PORT=9099
          EOF
          npm run lint -- --quiet
          npm run test:unit
          npm run test:rules
          npm run build
          npx playwright test --retries=0

      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-qa-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
