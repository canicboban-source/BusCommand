name: Integrated QA

on:
  push:
    branches:
      - preview/dispatcher-cockpit-qa
      - agent/v101-secure-plan-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full application verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: First complete verification
        run: |
          npm run lint -- --quiet
          npm run test:unit
          npm run test:rules
          npm run build
          npm run test:e2e

      - name: Second complete verification
        run: |
          npm run lint -- --quiet
          npm run test:unit
          npm run test:rules
          npm run build
          npm run test:e2e

      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-qa-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
